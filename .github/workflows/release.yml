name: Release

on:
  push:
    tags: ['v*']
  release:
    types: [published]

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PROJECT_VERSION=$(node -p "require('./package.json').version")
          test "$RELEASE_TAG" = "v$PROJECT_VERSION"
          test -f "docs/releases/$RELEASE_TAG.md"
      - run: npm test
      - run: npm run check
      - run: npm run package
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PROJECT_VERSION=$(node -p "require('./package.json').version")
          ASSETS=(
            "build/Dofus-Archipelago-$PROJECT_VERSION.zip" \
            build/manual_dofus_communaute.apworld \
            build/JoueurDofus.yaml \
            build/SHA256SUMS.txt
          )
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # Complete a release published from GitHub's web interface.
            # Existing assets are preserved; corrections need a new version.
            EXISTING_ASSETS=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
            for ASSET in "${ASSETS[@]}"; do
              if ! grep -Fxq "$(basename "$ASSET")" <<< "$EXISTING_ASSETS"; then
                gh release upload "$RELEASE_TAG" "$ASSET"
              fi
            done
          else
            gh release create "$RELEASE_TAG" "${ASSETS[@]}" \
              --verify-tag \
              --title "Dofus Archipelago $PROJECT_VERSION" \
              --notes-file "docs/releases/$RELEASE_TAG.md"
          fi
